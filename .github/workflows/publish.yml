name: Publish production image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-production-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check deployment configuration
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo '::error::Add the RENDER_DEPLOY_HOOK_URL repository secret before deploying.'
            exit 1
          fi
      - name: Test container
        run: docker build --target test -t meshwars-route-planner:test .
      - name: Prepare recent change notes
        run: python3 app_version.py /tmp/meshwars-release-notes.json
      - name: Build production image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          APP_CHANGES="$(cat /tmp/meshwars-release-notes.json)"
          docker build --target production \
            --build-arg "APP_REVISION=$COMMIT_SHA" \
            --build-arg "APP_CHANGES=$APP_CHANGES" \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$COMMIT_SHA" \
            -t "$IMAGE:latest" -t "$IMAGE:sha-$COMMIT_SHA" .
      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Push production image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          docker push "$IMAGE:sha-$COMMIT_SHA"
          docker push "$IMAGE:latest"
          {
            echo '### Published production image'
            echo "\`$IMAGE:latest\`"
            echo "\`$IMAGE:sha-$COMMIT_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy published commit to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}:sha-$COMMIT_SHA"
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 15 --max-time 60 \
            --get --data-urlencode "imgURL=$IMAGE" "$RENDER_DEPLOY_HOOK_URL"
          {
            echo '### Render deployment requested'
            echo "Requested deployment of \`$IMAGE\`."
            echo 'Check Render Events for rollout completion; hook acceptance does not confirm the service is live.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Sign out
        if: always()
        run: docker logout ghcr.io
